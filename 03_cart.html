<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordova Eats — Your Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --navy-mid: #1a2d42;
    --navy-card: #162235;
    --orange: #f46b1b;
    --orange-light: #ff8c42;
    --green: #2ecc71;
    --text-main: #f5f0e8;
    --text-muted: #8fa5bb;
    --border: rgba(255,255,255,0.08);
    --card-bg: #162235;
    --pill-bg: rgba(244,107,27,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: var(--text-main); min-height: 100vh; }
  h1,h2,h3 { font-family: 'Syne', sans-serif; }

  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,27,42,0.96); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2.5rem; display: flex; align-items: center; justify-content: space-between; height: 64px;
  }
  .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; }
  .nav-logo span { color: var(--orange); }
  .nav-links { display: flex; gap: 2rem; }
  .nav-links a { color: var(--text-muted); font-size: 0.875rem; text-decoration: none; font-weight: 500; }
  .nav-links a.active { color: var(--text-main); }
  .nav-cta {
    background: var(--orange); color: white; border: none;
    padding: 0.5rem 1.25rem; border-radius: 24px; font-family: 'DM Sans', sans-serif;
    font-weight: 500; font-size: 0.875rem; cursor: pointer;
  }

  .cart-layout {
    display: grid; grid-template-columns: 1fr 380px;
    gap: 2rem; max-width: 1100px; margin: 0 auto; padding: 3rem 2rem;
    align-items: start;
  }

  .cart-left h2 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.25rem; }
  .cart-sub { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }

  .cart-empty {
    text-align: center; padding: 5rem 2rem; color: var(--text-muted);
    grid-column: 1 / -1;
  }
  .cart-empty .big-icon { font-size: 4rem; margin-bottom: 1rem; }
  .cart-empty p { margin-bottom: 1.5rem; font-size: 1rem; }
  .btn-primary {
    background: var(--orange); color: white; border: none;
    padding: 0.875rem 2rem; border-radius: 32px; font-family: 'DM Sans', sans-serif;
    font-weight: 600; font-size: 1rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.5rem;
  }

  .cart-items { display: flex; flex-direction: column; gap: 0.875rem; }
  .cart-item {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 1rem 1.25rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .cart-item-icon { font-size: 2rem; flex-shrink: 0; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-weight: 600; font-size: 0.9rem; }
  .cart-item-shop { color: var(--text-muted); font-size: 0.78rem; margin-top: 0.15rem; }
  .qty-ctrl { display: flex; align-items: center; gap: 0.6rem; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: rgba(255,255,255,0.05);
    color: var(--text-main); cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-num { font-weight: 700; min-width: 1rem; text-align: center; font-size: 0.9rem; }
  .cart-item-price { font-weight: 700; color: var(--orange); font-size: 0.95rem; min-width: 60px; text-align: right; }
  .remove-btn {
    background: none; border: none; color: var(--text-muted);
    font-size: 1.1rem; cursor: pointer; padding: 0.25rem;
  }
  .remove-btn:hover { color: #e74c3c; }

  /* ORDER SUMMARY SIDEBAR */
  .order-summary {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 24px; padding: 1.75rem; position: sticky; top: 80px;
  }
  .summary-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; margin-bottom: 1.25rem; }
  .summary-row {
    display: flex; justify-content: space-between;
    font-size: 0.875rem; padding: 0.5rem 0; color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .summary-row:last-of-type { border-bottom: none; }
  .summary-row.total { font-size: 1.05rem; font-weight: 700; color: var(--text-main); padding-top: 1rem; }

  .delivery-info {
    background: var(--pill-bg); border: 1px solid rgba(244,107,27,0.2);
    border-radius: 12px; padding: 0.75rem 1rem;
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 0.8rem; color: var(--orange); margin: 1rem 0;
  }

  .checkout-btn {
    width: 100%; background: var(--orange); color: white; border: none;
    padding: 1rem; border-radius: 28px; font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 0.75rem;
    letter-spacing: 0.02em;
  }

  .continue-btn {
    width: 100%; background: transparent; color: var(--text-muted); border: 1px solid var(--border);
    padding: 0.75rem; border-radius: 28px; font-family: 'DM Sans', sans-serif;
    font-weight: 500; font-size: 0.875rem; cursor: pointer; margin-top: 0.625rem;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 9999;
    background: var(--card-bg); border: 1px solid rgba(46,204,113,0.4);
    color: var(--text-main); padding: 0.875rem 1.25rem; border-radius: 14px;
    font-size: 0.875rem; display: flex; align-items: center; gap: 0.6rem;
    transform: translateY(120%); transition: transform 0.35s ease;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateY(0); }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Cordova <span>Eats</span></div>
  <div class="nav-links">
    <a href="01_home.html">Home</a>
    <a href="02_menu.html">Browse Menu</a>
    <a href="04_track.html">Track Order</a>
  </div>
  <div style="display:flex;align-items:center;gap:1.25rem;">
    <span style="color:var(--orange);font-size:1.2rem;">🛒</span>
    <button class="nav-cta" onclick="window.location='02_menu.html'">Add More</button>
  </div>
</nav>

<div id="mainContent"></div>

<div class="toast" id="toast">
  <span style="color:#2ecc71;">✅</span>
  <span id="toastMsg">Done!</span>
</div>

<script>
function getCart() { try { return JSON.parse(localStorage.getItem('cordova_cart') || '[]'); } catch(e){ return []; } }
function saveCart(c) { localStorage.setItem('cordova_cart', JSON.stringify(c)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function render() {
  const cart = getCart();
  const el = document.getElementById('mainContent');

  if(cart.length === 0) {
    el.innerHTML = `<div class="cart-empty">
      <div class="big-icon">🛒</div>
      <p>Your cart is empty</p>
      <button class="btn-primary" onclick="window.location='02_menu.html'">🍽 Browse Menu</button>
    </div>`;
    return;
  }

  const subtotal = cart.reduce((s,i) => s + i.price * i.qty, 0);
  const delivery = 29;
  const total = subtotal + delivery;

  el.innerHTML = `
    <div class="cart-layout">
      <div class="cart-left">
        <h2>Your Cart</h2>
        <p class="cart-sub">${cart.reduce((s,i)=>s+i.qty,0)} item(s) from local restaurants</p>
        <div class="cart-items">
          ${cart.map(item => `
            <div class="cart-item">
              <div class="cart-item-icon">${item.emoji}</div>
              <div class="cart-item-info">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-shop">${item.shop}</div>
              </div>
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
                <span class="qty-num">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
              </div>
              <div class="cart-item-price">₱${item.price * item.qty}</div>
              <button class="remove-btn" onclick="removeItem(${item.id})">🗑</button>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="order-summary">
        <div class="summary-title">Order Summary</div>
        ${cart.map(i => `
          <div class="summary-row">
            <span>${i.name} × ${i.qty}</span>
            <span>₱${i.price * i.qty}</span>
          </div>
        `).join('')}
        <div class="summary-row" style="margin-top:0.5rem;">
          <span>Subtotal</span><span>₱${subtotal}</span>
        </div>
        <div class="summary-row">
          <span>Delivery fee</span><span>₱${delivery}</span>
        </div>
        <div class="summary-row total">
          <span>Total</span><span>₱${total}</span>
        </div>
        <div class="delivery-info">
          ⚡ Estimated delivery: <strong>15–20 minutes</strong>
        </div>
        <button class="checkout-btn" onclick="placeOrder()">Place Order →</button>
        <button class="continue-btn" onclick="window.location='02_menu.html'">+ Add More Items</button>
      </div>
    </div>
  `;
}

function changeQty(id, delta) {
  const cart = getCart();
  const item = cart.find(c => c.id === id);
  if(!item) return;
  item.qty += delta;
  const updated = delta < 0 && item.qty <= 0 ? cart.filter(c => c.id !== id) : cart;
  saveCart(updated);
  render();
}

function removeItem(id) {
  saveCart(getCart().filter(c => c.id !== id));
  render();
  showToast('Item removed from cart');
}

function placeOrder() {
  saveCart([]);
  showToast('🎉 Order placed! Tracking your delivery...');
  setTimeout(() => window.location = '04_track.html', 1200);
}

render();
</script>
</body>
</html>
