<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordova Eats — Browse Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --navy-mid: #1a2d42;
    --navy-card: #162235;
    --orange: #f46b1b;
    --orange-light: #ff8c42;
    --green: #2ecc71;
    --text-main: #f5f0e8;
    --text-muted: #8fa5bb;
    --border: rgba(255,255,255,0.08);
    --card-bg: #162235;
    --pill-bg: rgba(244,107,27,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: var(--text-main); min-height: 100vh; }
  h1,h2,h3 { font-family: 'Syne', sans-serif; }

  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,27,42,0.96); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2.5rem; display: flex; align-items: center; justify-content: space-between; height: 64px;
  }
  .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; }
  .nav-logo span { color: var(--orange); }
  .nav-links { display: flex; gap: 2rem; }
  .nav-links a { color: var(--text-muted); font-size: 0.875rem; text-decoration: none; font-weight: 500; }
  .nav-links a.active { color: var(--text-main); }
  .cart-btn {
    position: relative; background: none; border: none; color: var(--text-muted);
    font-size: 1.2rem; cursor: pointer;
  }
  .cart-badge-num {
    position: absolute; top: -6px; right: -8px; background: var(--orange); color: white;
    border-radius: 50%; width: 18px; height: 18px; font-size: 0.65rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-cta {
    background: var(--orange); color: white; border: none;
    padding: 0.5rem 1.25rem; border-radius: 24px; font-family: 'DM Sans', sans-serif;
    font-weight: 500; font-size: 0.875rem; cursor: pointer;
  }

  .menu-header { padding: 3rem 4rem 1.5rem; border-bottom: 1px solid var(--border); }
  .section-label { font-size: 0.75rem; font-weight: 700; color: var(--orange); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.5rem; }
  .section-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }

  .cat-tabs { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
  .cat-tab {
    padding: 0.5rem 1.25rem; border-radius: 24px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem; font-weight: 500; cursor: pointer;
  }
  .cat-tab.active { background: var(--orange); border-color: var(--orange); color: white; }

  .menu-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1.25rem; padding: 2rem 4rem;
  }
  .menu-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 20px; overflow: hidden;
  }
  .menu-img {
    height: 130px; display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem; background: rgba(255,255,255,0.03);
  }
  .menu-body { padding: 1.25rem; }
  .menu-shop { font-size: 0.72rem; color: var(--orange); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; }
  .menu-name { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; }
  .menu-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1rem; }
  .menu-footer { display: flex; align-items: center; justify-content: space-between; }
  .menu-price { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--orange); }
  .add-btn {
    background: var(--orange); color: white; border: none;
    width: 34px; height: 34px; border-radius: 50%; font-size: 1.25rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 300;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 9999;
    background: var(--card-bg); border: 1px solid rgba(46,204,113,0.4);
    color: var(--text-main); padding: 0.875rem 1.25rem; border-radius: 14px;
    font-size: 0.875rem; display: flex; align-items: center; gap: 0.6rem;
    transform: translateY(120%); transition: transform 0.35s ease;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateY(0); }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Cordova <span>Eats</span></div>
  <div class="nav-links">
    <a href="01_home.html">Home</a>
    <a href="02_menu.html" class="active">Browse Menu</a>
    <a href="04_track.html">Track Order</a>
  </div>
  <div style="display:flex;align-items:center;gap:1.25rem;">
    <button class="cart-btn" onclick="window.location='03_cart.html'">
      🛒
      <span class="cart-badge-num" id="cartBadge">0</span>
    </button>
    <button class="nav-cta">Order Now</button>
  </div>
</nav>

<div class="menu-header">
  <div class="section-label">Browse</div>
  <h2 class="section-title">Local Menus</h2>
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="all">All</button>
    <button class="cat-tab" data-cat="rice">🍱 Rice Meals</button>
    <button class="cat-tab" data-cat="soup">🍜 Soups</button>
    <button class="cat-tab" data-cat="chicken">🍗 Chicken</button>
    <button class="cat-tab" data-cat="veggies">🥗 Veggies</button>
    <button class="cat-tab" data-cat="snacks">🍢 Snacks</button>
    <button class="cat-tab" data-cat="drinks">🧃 Drinks</button>
  </div>
</div>

<div class="menu-grid" id="menuGrid"></div>

<div class="toast" id="toast">
  <span style="color:#2ecc71;">✅</span>
  <span id="toastMsg">Added to cart!</span>
</div>

<script>
const menuData = [
  { id:1, name:"Chicken Inasal", shop:"Mang Boy's Grill", price:85, emoji:"🍗", cat:"chicken", desc:"Charcoal-grilled chicken marinated in local spices, served with garlic rice." },
  { id:2, name:"Lomi Special", shop:"Aling Nena's", price:70, emoji:"🍜", cat:"soup", desc:"Thick egg noodle soup with pork, liver, kikiam, and fresh egg." },
  { id:3, name:"Pinakbet Bowl", shop:"Cordova Kusina", price:65, emoji:"🥗", cat:"veggies", desc:"Local vegetable medley sautéed in fermented shrimp paste and pork bits." },
  { id:4, name:"Sinugba Rice Meal", shop:"Bayside Bites", price:95, emoji:"🍱", cat:"rice", desc:"Grilled pork belly with steamed rice, fresh tomato salsa, and sawsawan." },
  { id:5, name:"Pork Sinigang", shop:"Aling Nena's", price:80, emoji:"🍲", cat:"soup", desc:"Sour tamarind broth with tender pork ribs and fresh garden vegetables." },
  { id:6, name:"Palabok Fiesta", shop:"Cordova Kusina", price:75, emoji:"🍝", cat:"rice", desc:"Rice noodles topped with shrimp sauce, tinapa flakes, and hard-boiled egg." },
  { id:7, name:"Pork BBQ Stick", shop:"Mang Boy's Grill", price:30, emoji:"🍢", cat:"snacks", desc:"Sweetened pork skewers charcoal-grilled to smoky perfection." },
  { id:8, name:"Kare-Kare", shop:"Bayside Bites", price:110, emoji:"🥜", cat:"veggies", desc:"Rich peanut-based stew with oxtail, banana blossom, and eggplant." },
  { id:9, name:"Iced Sago't Gulaman", shop:"Merienda Corner", price:35, emoji:"🧃", cat:"drinks", desc:"Refreshing cold drink with tapioca pearls and brown sugar syrup." },
  { id:10, name:"Buko Juice (Fresh)", shop:"Merienda Corner", price:40, emoji:"🥥", cat:"drinks", desc:"Cold fresh coconut water straight from locally-sourced buko." },
  { id:11, name:"Fried Lumpia (5pcs)", shop:"Bayside Bites", price:50, emoji:"🥟", cat:"snacks", desc:"Crispy golden spring rolls filled with minced pork and vegetables." },
  { id:12, name:"Adobo Rice Meal", shop:"Cordova Kusina", price:72, emoji:"🍚", cat:"rice", desc:"Classic Filipino chicken adobo served with garlic sinangag and atchara." },
];

function getCart() { try { return JSON.parse(localStorage.getItem('cordova_cart') || '[]'); } catch(e){ return []; } }
function saveCart(c) { localStorage.setItem('cordova_cart', JSON.stringify(c)); }

function updateBadge() {
  const total = getCart().reduce((s,i)=>s+i.qty,0);
  document.getElementById('cartBadge').textContent = total;
}

function renderMenu(cat) {
  const items = cat === 'all' ? menuData : menuData.filter(i => i.cat === cat);
  document.getElementById('menuGrid').innerHTML = items.map(item => `
    <div class="menu-card">
      <div class="menu-img">${item.emoji}</div>
      <div class="menu-body">
        <div class="menu-shop">${item.shop}</div>
        <div class="menu-name">${item.name}</div>
        <div class="menu-desc">${item.desc}</div>
        <div class="menu-footer">
          <div class="menu-price">₱${item.price}</div>
          <button class="add-btn" onclick="addToCart(${item.id})">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

function addToCart(id) {
  const item = menuData.find(i => i.id === id);
  const cart = getCart();
  const ex = cart.find(c => c.id === id);
  if(ex) ex.qty++; else cart.push({...item, qty:1});
  saveCart(cart);
  updateBadge();
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = `${item.emoji} ${item.name} added!`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

document.getElementById('catTabs').addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if(!tab) return;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  renderMenu(tab.dataset.cat);
});

renderMenu('all');
updateBadge();
</script>
</body>
</html>
